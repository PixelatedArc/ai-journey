      - generic [ref=f7e101]:
        - heading "Children/Teen treatment" [level=2] [ref=f7e103]:
          - text: Children/Teen
          - generic [ref=f7e104]: treatment
        - generic [ref=f7e105]:
          - paragraph [ref=f7e106]: At Yousefian Orthodontics, we believe everyone deserves a bright, healthy smile they love to share. We offer proven treatment options for children and teens, correcting functional issues and guiding the development of the growing oral cavity.
          - paragraph [ref=f7e107]: Utilizing leading-edge techniques and state-of-the-art appliances, Dr. Yousefian ensures proper airway function and a stable bite. The new smiles he creates last lifetimes, transforming his patients’ self-esteem and the confidence with which they take on the world!
        - link "learn more about teen treatment" [ref=f7e109] [cursor=pointer]:
