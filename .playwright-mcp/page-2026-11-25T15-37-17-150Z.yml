        - generic [ref=f7e94]:
          - paragraph [ref=f7e95]: "Yousefian Orthodontics straightens teeth, improving oral health and overall wellness while changing smiles, with specialized services for adults. We respect your individual concerns and will work with you to achieve your goals: efficiently and comfortably."
          - paragraph [ref=f7e96]: Our approach to orthodontics goes beyond aesthetics. In focusing on improving your bite and airway concerns, Dr. Yousefian ensures you finish treatment with better function and a great smile – a smile that brims with confidence!
