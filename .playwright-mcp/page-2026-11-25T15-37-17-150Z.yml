      - generic [ref=f7e112]:
        - heading "sleep apnea" [level=2] [ref=f7e114]:
          - text: sleep
          - generic [ref=f7e115]: apnea
        - generic [ref=f7e116]:
          - paragraph [ref=f7e117]: Sleep apnea can cause serious health issues at any age. As breathing stops and starts throughout your sleep period, it keeps you from being well-rested and can deprive vital organs, including the brain, from receiving enough oxygen.
          - paragraph [ref=f7e118]: Dr. Yousefian is a world-renowned expert in treating sleep apnea in children and adults. Utilizing integrated techniques, he offers a non-surgical treatment that corrects the root causes of apnea. Your sleep will improve, and so will your health and outlook on life!
        - link "learn more about sleep apnea" [ref=f7e120] [cursor=pointer]:
          - /url: https://staging.daxprojects.com/dryousefian/sleep-apnea/
      - generic [ref=f7e123]:
        - heading "TMJ" [level=2] [ref=f7e125]
        - generic [ref=f7e127]:
          - paragraph [ref=f7e128]: Millions of Americans suffer from chronic facial and neck pain as well as severe, recurring headaches. In some cases, this pain is due to Temporomandibular Disorder, also known as TMD.
          - paragraph [ref=f7e129]: Your temporomandibular joints, or TMJs, connect your lower jawbone to your skull. These joints get a lot of use throughout the day as you speak, chew, swallow, and yawn.
        - link "learn more about Temporomandibular Disorder" [ref=f7e131] [cursor=pointer]:
